svg{width:100%;height:100%}
#legend{position:absolute;top:16px;right:16px;background:rgba(22,27,34,.93);border:1px solid #30363d;border-radius:8px;padding:12px 16px;font-size:12px;pointer-events:none}

.ld{width:12px;height:12px;border-radius:50%;flex-shrink:0}

const AN = G.nodes, AE = G.edges;
let svg, root, zoom, sim, sbOpen=true, kScale=1;

function toggleSB(){sbOpen=!sbOpen;document.getElementById('sidebar').classList.toggle('collapsed',!sbOpen);document.getElementById('sb-toggle').textContent=sbOpen?'收起':'展开';}

function showInfo(d){
  const list = document.getElementById('sb-list');
  const stats = document.getElementById('sb-stats');
  if(d.type === 'category'){
    document.getElementById('sb-title').textContent = d.label;
    stats.style.display = 'block';
    document.getElementById('sb-st').innerHTML = '包含 <span>' + d.count + '</span> 篇论文';
    const papers = (d.papers || []).sort((a,b)=>((b.year||'0')<(a.year||'0')?-1:1));
    list.innerHTML = papers.map((p,i) => `
      <div class="sb-item">
        <div class="sb-item-title">${i+1}. ${p.title}</div>
        <div class="sb-item-meta"><span class="sb-yr">${p.year||'?'}</span>${p.author||''}</div>
      </div>
    `).join('');
  } else {
    document.getElementById('sb-title').textContent = '论文详情';
    stats.style.display = 'none';
    list.innerHTML = `
      <div class="sb-item" style="background:#21262d">
        <div class="sb-item-title" style="font-size:15px">${d.full_title}</div>
        <div class="sb-item-meta" style="font-size:12px;margin-top:10px">
          <p>年份: <span class="sb-yr">${d.year||'未知'}</span></p>
          <p style="margin-top:5px">作者: ${d.author||'未记录'}</p>
          <p style="margin-top:5px">单位: ${d.unit||'未记录'}</p>
          <p style="margin-top:5px">关键词: ${d.keywords||'无'}</p>
        </div>
      </div>
    `;
  }
  if(!sbOpen) toggleSB();
}

function render(){
  const W = document.getElementById('graph-wrap').clientWidth, H = window.innerHeight;
  if(sim) sim.stop();

  sim = d3.forceSimulation(AN)
    .force('link', d3.forceLink(AE).id(d => d.id).distance(d => d.type==='paper_cat' ? 60 : 150).strength(0.3))
    .force('charge', d3.forceManyBody().strength(d => d.type==='category' ? -1000 : -50))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide().radius(d => (d.r || 5) + 2));

  const ge = d3.select('#ge'); ge.selectAll('*').remove();
  const link = ge.selectAll('line').data(AE).join('line')
    .attr('stroke', '#30363d').attr('stroke-width', 1).attr('stroke-opacity', 0.4);

  const gn = d3.select('#gn'); gn.selectAll('*').remove();
  const node = gn.selectAll('g').data(AN).join('g').attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e, d) => { d.fx=e.x; d.fy=e.y; })
      .on('end', (e, d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  node.append('circle')
    .attr('r', d => d.r || 5)
    .attr('fill', d => d.color)
    .attr('fill-opacity', d => d.type==='category' ? 0.9 : 0.6)
    .attr('stroke', d => d.color).attr('stroke-width', 1).attr('stroke-opacity', 0.3);

  const labels = node.append('text')
    .text(d => d.type==='category' ? d.label : d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', d => (d.r || 5) + 12)
    .attr('font-size', d => d.type==='category' ? 14 : 9)
    .attr('fill', d => d.color)
    .attr('font-weight', d => d.type==='category' ? 'bold' : 'normal')
    .attr('pointer-events', 'none')
    .style('opacity', d => d.type==='category' ? 1 : 0);

  const tt = document.getElementById('tt');
  node.on('mouseover', (e, d) => {
    tt.style.display = 'block';
    if(d.type === 'category'){
      tt.innerHTML = `<div class="ttn">${d.label}</div><div class="ttp">研究分类 | ${d.count}篇论文</div>`;
    } else {
      tt.innerHTML = `<div class="ttn">${d.full_title}</div><div class="ttp">${d.year ? '['+d.year+'] ' : ''}${d.author || ''}</div><div class="ttd">点击查看详情</div>`;
    }
  }).on('mousemove', e => { tt.style.left=(e.clientX+15)+'px'; tt.style.top=(e.clientY-10)+'px'; })
    .on('mouseout', () => { tt.style.display='none'; });

  node.on('click', (e, d) => { showInfo(d); e.stopPropagation(); });

  sim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
    // 动态显示论文标签
    if(kScale > 1.5) labels.style('opacity', d => d.type==='category' ? 1 : (kScale - 1.5) * 2);
    else labels.style('opacity', d => d.type==='category' ? 1 : 0);
  });
}

function resetV(){ svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity); }

svg = d3.select('#svg'); root = d3.select('#root');
zoom = d3.zoom().scaleExtent([0.05, 10]).on('zoom', e => { 
  kScale = e.transform.k; 
  root.attr('transform', e.transform);
});
svg.call(zoom);
render();
</script>
